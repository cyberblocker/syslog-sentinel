# On a separate Linux client with rsyslog already installed.
# Replace 192.0.2.10 with your collector VM's private lab IP.
# Forward only local test messages first to avoid sending unrelated logs.
# The built-in RFC5424 template emits NIL structured data for ordinary messages.
if $programname == 'sentinel-test' then {
    action(type="omfwd" target="192.0.2.10" port="5514" protocol="tcp"
           TCP_Framing="octet-counted" template="RSYSLOG_SyslogProtocol23Format"
           queue.type="LinkedList" queue.size="10000" action.resumeRetryCount="-1")
}
